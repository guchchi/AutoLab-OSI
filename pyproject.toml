[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autolab-osi"
version = "2.4.0"
description = "Autonomous Literature-to-Hardware Scientific Execution Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AutoLab Scientific Consortium" }
]
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "marimo>=0.25.0",
    "altair>=5.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0"
]

[project.urls]
Homepage = "https://github.com/guchchi/AutoLab-OSI"
Documentation = "https://github.com/guchchi/AutoLab-OSI#readme"
